name: Reusable Foundation check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out Foundation tooling
        uses: actions/checkout@v4
        with:
          repository: bpstr/foundation
          ref: main
          path: .foundation-tooling

      - name: Validate Foundation structure
        run: .foundation-tooling/tools/check.sh .
