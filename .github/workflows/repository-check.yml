name: Foundation repository check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n install.sh tools/check.sh project-template/scripts/*.sh

      - name: Validate project template
        run: ./tools/check.sh project-template
